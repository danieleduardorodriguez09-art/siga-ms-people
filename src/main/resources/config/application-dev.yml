# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

management:
  otlp:
    tracing:
      endpoint: http://localhost:4317
      transport: grpc

logging:
  level:
    ROOT: DEBUG
    co.gov.aerocivil.siga: DEBUG
    com.fasterxml: ERROR
    com.hazelcast: ERROR
    com.keycloak: ERROR
    com.oracle.coherence: INFO
    com.zaxxer.hikari: ERROR
    io.micrometer: INFO
    io.netty: INFO
    io.opentelemetry: INFO
    io.undertow: INFO
    java.io: ERROR
    javax.management: ERROR
    jdk.event.security: ERROR
    okhttp3.internal: ERROR
    org.apache: ERROR
    org.aspectj: ERROR
    org.flowable: INFO
    org.hibernate: ERROR
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.type.descriptor.sql: INFO
    org.springframework.boot: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework: ERROR
    org.xnio: ERROR
    sun.net: ERROR
    sun.rmi: ERROR
    reactor.netty: WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(${PID:-}){magenta} [%clr(${spring.application.name:-}){blue}] %clr(%5p){} %clr(--- %esb(){APPLICATION_NAME}%esb{APPLICATION_GROUP}[%15.15t]){faint} [%clr(%X{traceId:-}){yellow}][%clr(%X{spanId:-}){cyan}] %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
  include-application-name: false
#  register-shutdown-hook: false

spring:

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  jackson:
    serialization:
      indent_output: true

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:oracle:thin:@192.168.100.200:1521:ORCL
    username: SIGA_NEGOCIO
    password: SIGA_NEGOCIO
    hikari:
      pool-name: Hikari
      auto-commit: false

  jpa:
    database: oracle
    properties:
      hibernate.show_sql: true

  messages:
    cache-duration: PT1S

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.aerocivil.local/realms/siga
          jwk-set-uri: https://auth.aerocivil.local/realms/siga/protocol/openid-connect/certs

server:
  port: 9401

# ===================================================================
# Application specific properties
# ===================================================================

siga:
  cache:
    hazelcast:
      backup-count: 0
      time-to-live-seconds: 3600
  cors:
    # Allow Ionic for JHipster by default (* no longer allowed in Spring Boot 2.4+)
    allowed-origins: '*'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${siga.clientApp.name}-alert,X-${siga.clientApp.name}-error,X-${siga.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
